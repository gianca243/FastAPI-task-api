services:
  fast_api_app:
    build: ..
    ports: 
      - "8000:8000"
    env_file: ../.env
    environment:
      POSTGRES_HOST: postgres_test_server
      POSTGRES_PORT: 5432
    depends_on: 
      postgres_test_server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 3

  postgres_test_server:
    image: postgres:16
    ports:
      - 8081:5432
    env_file: ../.env
    volumes:
      - ./database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s # cada cuánto lo prueba
      timeout: 3s # cuánto espera cada intento
      retries: 5 # cuántos fallos seguidos antes de marcarlo "unhealthy"