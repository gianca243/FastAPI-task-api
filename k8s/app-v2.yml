apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-api-v2
spec:
  replicas: 1 # este no define el peso que va a recibir de trafico sino que tantos pods va a manejar ese trafico
  selector:
    matchLabels:
      app: task-api-v2 # define que pods que se hayan creado pertecen a este deploy 2
  template:
    metadata:
      labels:
        app: task-api-v2 # define como le ponen una etiqueta a los pods 1
    spec:
      containers:
        - name: task-api-v2
          image: task-api:0.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: task-api-config
            - secretRef:
                name: task-api-secret
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: task-api-v2 
spec:
  selector:
    app: task-api-v2 # indica que pods debe de enviar trafico 3
  ports:
    - port: 80
      targetPort: 8000
