apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres     # qué Pods "pertenecen" a este Deployment
  template:           # molde de los Pods
    metadata:
      labels:
        app: postgres # tiene que coincidir con matchLabels
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: task-api-config
            - secretRef:
                name: task-api-secret
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"] # postgres el user de la db
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  selector:
    app: postgres
  ports:
    - port: 5432        # puerto del Service (al que se conecta la app)
      targetPort: 5432  # puerto del contenedor